<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Khipu — Control de ingresos y egresos</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="contenedor">
    <header class="cabecera">
      <h1>Khipu</h1>
      <p>Control de ingresos y egresos</p>
    </header>

    <section class="resumen" aria-label="Resumen de totales">
      <article class="tarjeta-resumen ingresos">
        <span class="icono" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" focusable="false">
            <path d="M12 19V5"></path>
            <path d="m5 12 7-7 7 7"></path>
          </svg>
        </span>
        <div>
          <p class="etiqueta-resumen">Ingresos</p>
          <p class="monto-resumen" id="total-ingresos">0,00</p>
        </div>
      </article>

      <article class="tarjeta-resumen egresos">
        <span class="icono" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" focusable="false">
            <path d="M12 5v14"></path>
            <path d="m19 12-7 7-7-7"></path>
          </svg>
        </span>
        <div>
          <p class="etiqueta-resumen">Egresos</p>
          <p class="monto-resumen" id="total-egresos">0,00</p>
        </div>
      </article>

      <article class="tarjeta-resumen saldos saldo-cero" id="tarjeta-saldo">
        <span class="icono" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" focusable="false">
            <path d="M19 7V4a1 1 0 0 0-1-1H5a2 2 0 0 0 0 4h15a1 1 0 0 1 1 1v4h-3a2 2 0 0 0 0 4h3a1 1 0 0 0 1-1v-2a1 1 0 0 0-1-1"></path>
            <path d="M3 5v14a2 2 0 0 0 2 2h15a1 1 0 0 0 1-1v-4"></path>
          </svg>
        </span>
        <div>
          <p class="etiqueta-resumen">Saldos</p>
          <p class="monto-resumen" id="saldo">0,00</p>
        </div>
      </article>
    </section>

    <section class="tarjeta" aria-labelledby="titulo-formulario">
      <h2 id="titulo-formulario">Nuevo movimiento</h2>

      <form id="formulario" novalidate>
        <fieldset class="tipo">
          <legend>Tipo</legend>
          <div class="opciones-tipo">
            <label class="opcion ingreso">
              <input type="radio" name="tipo" value="ingreso" checked>
              <span>Ingreso</span>
            </label>
            <label class="opcion egreso">
              <input type="radio" name="tipo" value="egreso">
              <span>Egreso</span>
            </label>
          </div>
        </fieldset>

        <div class="campo">
          <label for="fecha">Fecha</label>
          <input type="date" id="fecha" name="fecha" required>
        </div>

        <div class="campo">
          <label for="concepto">Concepto</label>
          <input type="text" id="concepto" name="concepto" placeholder="Ej. Sueldo, supermercado..." required>
        </div>

        <div class="campo">
          <label for="monto">Monto</label>
          <input type="number" id="monto" name="monto" inputmode="decimal" step="0.01" min="0.01" placeholder="0,00" required>
        </div>

        <p class="error" id="error" role="alert" hidden></p>

        <div class="acciones-formulario">
          <button type="submit" id="boton-guardar">Añadir movimiento</button>
          <button type="button" class="boton-secundario" id="cancelar-edicion" hidden>Cancelar</button>
        </div>
      </form>
    </section>

    <section class="tarjeta" aria-labelledby="titulo-movimientos">
      <h2 id="titulo-movimientos" tabindex="-1">Últimos movimientos</h2>
      <ul class="lista" id="lista"></ul>
      <p class="vacio" id="vacio">Todavía no hay movimientos.</p>
    </section>
  </main>

  <dialog class="dialogo" id="dialogo-eliminar" aria-labelledby="dialogo-titulo" aria-describedby="dialogo-descripcion">
    <div class="dialogo-contenido">
      <h2 id="dialogo-titulo">Eliminar movimiento</h2>
      <p id="dialogo-descripcion">¿Seguro que quieres eliminar “<strong id="dialogo-concepto"></strong>”?</p>
      <p class="dialogo-detalle" id="dialogo-detalle"></p>
      <div class="acciones-dialogo">
        <button type="button" class="boton-secundario" id="cancelar-eliminar">Cancelar</button>
        <button type="button" class="boton-peligro" id="confirmar-eliminar">Eliminar</button>
      </div>
    </div>
  </dialog>

  <div class="toast" id="toast" role="status" aria-live="polite" aria-atomic="true">
    <span class="toast-icono" aria-hidden="true">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" focusable="false">
        <path d="m5 12 5 5L20 7"></path>
      </svg>
    </span>
    <span id="toast-texto"></span>
  </div>

  <script src="app.js"></script>
</body>
</html>
